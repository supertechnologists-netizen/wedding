:root {
  --ink: #17050A;
  --wine-deep: #2A0810;
  --wine: #4B0F1C;
  --wine-soft: #6E1A2C;
  --milk: #F4EBE4;
  --milk-2: #EBDDD3;
  --powder: #E9CFCB;
  --gold: #BFA07A;
  --on-wine-muted: rgba(244, 235, 228, .68);
  --on-wine-line: rgba(244, 235, 228, .22);
  --on-milk: #3B0A15;
  --on-milk-muted: rgba(59, 10, 21, .66);
  --on-milk-line: rgba(75, 15, 28, .2);
  --f-display: "Cormorant Garamond", Georgia, serif;
  --f-body: "Jost", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #555; font-family: var(--f-body); font-weight: 300; -webkit-font-smoothing: antialiased; }
body:not(.export) { padding: 40px; display: grid; gap: 40px; justify-content: center; }
.export { background: none; }
@page { margin: 0; }
img { display: block; }

.slide {
  position: relative;

}
.post .slide { height: 1350px; }
.square .slide { height: 1080px; }
.story .slide { height: 1920px; }
.slide > * { position: absolute; }

/* Поверхні */
.wine {

}
.deep {
  color: var(--milk);
  background:

    linear-gradient(var(--wine-deep), var(--ink));
}
.milk { color: var(--on-milk); background: radial-gradient(90% 70% at 50% 40%, #F8F1EC, var(--milk) 55%, var(--milk-2)); }
.powder { color: var(--on-milk); background: radial-gradient(80% 60% at 50% 20%, #F8F1EC, var(--milk) 50%, #EED9D3); }

/* Плівкове зерно, як на сайті */

}
.milk::after, .powder::after { opacity: .05; }

.milk .frame, .powder .frame { border-color: var(--on-milk-line); }
.milk .frame::before, .powder .frame::before { border-color: rgba(75, 15, 28, .07); }
.milk .frame i, .powder .frame i { background: var(--milk); }

  box-shadow:

}
.milk .phone, .powder .phone {

.phone .screen { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: calc(var(--w) * .13); background: var(--wine-deep); }
.phone .screen img { width: 100%; }
.phone::after { /* Dynamic Island */
  content: ""; position: absolute; top: calc(var(--w) * .058); left: 50%; width: calc(var(--w) * .28); height: calc(var(--w) * .078);

  <div class="frame"><i></i><i></i></div>
  <div class="logo" data-logo="light"></div>
  <p class="eyebrow page">01 — 04</p>
  <h1 class="title" data-t="s1_title"></h1>
  <p class="lead" data-t="s1_subtitle"></p>
  <div class="hair"></div>
  <ul class="events" data-list="events"></ul>
  <div class="glow"></div>
  <div class="phone"><div class="screen"><img src="shots/hero.png" alt=""></div></div>
  <figure class="shot" style="--z:122%;--y:5.5%"><img src="shots/invite.png" alt=""></figure>
  <div class="badge"><span class="label" data-t="s1_badge_label"></span><span class="sep"></span><span class="value" data-t="s1_badge_value"></span></div>
</section>

<!-- 2. ПОРТФОЛІО -->
<section class="slide s2 milk">
  <div class="frame"><i></i><i></i></div>
  <p class="eyebrow center" data-t="s2_eyebrow"></p>
  <p class="eyebrow page">02 — 04</p>
  <h2 class="title center" data-t="s2_title"></h2>
  <p class="caption center" data-t="s2_caption"></p>
  <div class="phone"><div class="screen"><img src="shots/hero.png" alt=""></div></div>
  <figure class="shot a" style="--z:118%;--y:5%"><img src="shots/invite.png" alt=""></figure>
  <figure class="shot b" style="--y:2.5%"><img src="shots/rsvp.png" alt=""></figure>
  <figure class="shot c" style="--z:112%;--y:7%"><img src="shots/day.png" alt=""></figure>
  <figure class="shot d" style="--y:10%"><img src="shots/dress.png" alt=""></figure>
  <figure class="shot e" style="--z:118%;--y:44.5%"><img src="shots/day.png" alt=""></figure>
  <p class="note center" data-t="s2_note"></p>
</section>

<!-- 3. ЩО ОТРИМУЄ КЛІЄНТ -->
<section class="slide s3 deep">
  <div class="frame"><i></i><i></i></div>
  <p class="eyebrow center" data-t="s3_eyebrow"></p>
  <p class="eyebrow page">03 — 04</p>
  <h2 class="title center" data-t="s3_title"></h2>
  <ul class="feat l" data-feat="0,4"></ul>
  <div class="phone"><div class="screen"><img src="shots/full.png" alt=""></div></div>
  <ul class="feat r" data-feat="4,8"></ul>
  <div class="hair"></div>
  <div class="badge"><span class="label" data-t="s3_badge_label"></span><span class="sep"></span><span class="value" data-t="s3_badge_value"></span><span class="sep"></span></div>
</section>

<!-- 4. КОНТАКТИ -->
<section class="slide s4 powder">
  <div class="frame"><i></i><i></i></div>
  <svg class="rings" viewBox="0 0 120 80" aria-hidden="true"><circle cx="46" cy="40" r="30"/><circle cx="74" cy="40" r="30"/></svg>
  <div class="logo" data-logo="dark"></div>
  <h2 class="title center" data-t="s4_title"></h2>
  <p class="lead center" data-t="s4_text"></p>
  <div class="card">
    <p class="name" data-c="name"></p>
    <div class="rows">
      <p class="row"><span>Телефон</span><b data-c="phone"></b></p>
      <p class="row"><span>Instagram</span><b data-c="instagram"></b></p>
      <p class="row"><span>Email</span><b data-c="email"></b></p>
    </div>
  </div>
  <p class="cta"><span data-t="s4_cta"></span><svg viewBox="0 0 26 12"><path d="M0 6h24M19 1l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></p>
  <p class="events center" data-events-inline></p>
  <div class="phone"><div class="screen"><img src="shots/finale.png" alt=""></div></div>
</section>

<script src="content.js"></script>
<script>
(function () {
  var C = window.CONTENT;
  var q = new URLSearchParams(location.search);
  var fmt = q.get('f') || 'post';
  document.body.className = fmt + (q.has('export') ? ' export' : '');

  var ICONS = {
    names: '<circle cx="11" cy="16" r="7"/><circle cx="21" cy="16" r="7"/>',
    place: '<path d="M16 29s9-8.6 9-15.5A9 9 0 0 0 7 13.5C7 20.4 16 29 16 29z"/><circle cx="16" cy="13.5" r="3.2"/>',
    program: '<circle cx="16" cy="16" r="12"/><path d="M16 9v7l5 3"/>',
    gallery: '<rect x="4" y="7" width="24" height="18" rx="2"/><circle cx="11" cy="13" r="2.2"/><path d="M4 22l7-6 5 4 4-3 8 6"/>',
    map: '<path d="M4 8l8-3 8 3 8-3v19l-8 3-8-3-8 3z"/><path d="M12 5v19M20 8v19"/>',
    dress: '<path d="M16 9a2.5 2.5 0 1 1 2.5-2.5M16 9v2L4 20.5c-1 .8-.5 2 .7 2h22.6c1.2 0 1.7-1.2.7-2L16 11"/>',
    rsvp: '<rect x="4" y="8" width="24" height="17" rx="2"/><path d="M4 10l12 8 12-8"/><path d="M20 27l3 2.5 6-6" transform="translate(-2 -4)"/>',
    info: '<circle cx="16" cy="16" r="12"/><path d="M16 14.5V22M16 10v.5"/>'
  };

  document.querySelectorAll('[data-t]').forEach(function (el) { el.innerHTML = C[el.dataset.t] || ''; });
  document.querySelectorAll('[data-c]').forEach(function (el) { el.textContent = C.contacts[el.dataset.c] || ''; });
  document.querySelectorAll('[data-list]').forEach(function (el) {
    el.innerHTML = C[el.dataset.list].map(function (t) { return '<li>' + t + '</li>'; }).join('');
  });
  document.querySelectorAll('[data-events-inline]').forEach(function (el) { el.textContent = C.events.join('  ·  '); });
  document.querySelectorAll('[data-feat]').forEach(function (el) {
    var r = el.dataset.feat.split(',').map(Number);
    el.innerHTML = C.features.slice(r[0], r[1]).map(function (f) {
      return '<li><svg class="ic" viewBox="0 0 32 32">' + ICONS[f[0]] + '</svg><span>' + f[1] + '</span></li>';
    }).join('');
  });
  document.querySelectorAll('[data-logo]').forEach(function (el) {
    var src = el.dataset.logo === 'light' ? (C.logoLight || C.logo) : C.logo;
    if (src) el.innerHTML = '<img src="' + src + '" alt="Логотип">';
    else el.classList.add('empty');
  });
})();
</script>
</body>
</html>
